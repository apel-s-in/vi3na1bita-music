name: Validate application contracts

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.meta/**'
  pull_request:
    paths-ignore:
      - '.meta/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate web manifest
        run: node scripts/ci/validate-manifest.mjs

      - name: Validate Service Worker contract
        run: node scripts/ci/lint-sw.mjs

      - name: Validate local content indexes
        run: |
          node scripts/ci/validate-content.mjs
          node scripts/ci/validate-intel-profiles.mjs

      - name: Validate first-party JavaScript syntax
        run: |
          set -euo pipefail

          node --check service-worker.js
          node --check generate-context.js

          checked=0
          while IFS= read -r file; do
            node --input-type=module --check < "$file"
            checked=$((checked + 1))
          done < <(
            find scripts src \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              ! -path 'scripts/vendor/*' \
              | sort
          )

          test "$checked" -gt 0
          echo "Validated $checked first-party JavaScript modules"

      - name: Validate Cloud Function sources
        run: |
          set -euo pipefail

          functions=(
            "vi3-signaling"
            "vi3na1bita-backup-proxy"
            "vi3-webpush"
            "vi3-loyalty-reminder"
          )

          checked_sources=0
          checked_packages=0

          for function_name in "${functions[@]}"; do
            function_dir="cloud-functions/$function_name"
            index_file="$function_dir/index.js"
            package_file="$function_dir/package.json"

            test -s "$index_file"
            test -s "$package_file"

            if grep -Fq 'FILE: /package.json' "$index_file"; then
              echo "Generated context was pasted into $index_file"
              exit 2
            fi

            while IFS= read -r source_file; do
              node --check "$source_file"
              checked_sources=$((checked_sources + 1))
            done < <(
              find "$function_dir" -maxdepth 1 -type f -name '*.js' | sort
            )

            node -e "
              const fs = require('fs');
              const file = process.argv[1];
              const value = JSON.parse(
                fs.readFileSync(file, 'utf8')
              );

              if (
                !value ||
                typeof value !== 'object' ||
                Array.isArray(value)
              ) {
                throw new Error(
                  'package_json_object_required'
                );
              }

              if (
                value.main &&
                value.main !== 'index.js'
              ) {
                throw new Error(
                  'package_json_main_must_be_index_js'
                );
              }
            " "$package_file"
            checked_packages=$((checked_packages + 1))
          done

          test "$checked_sources" -gt 0
          test "$checked_packages" -eq "${#functions[@]}"
          echo "Validated $checked_sources Cloud Function sources and $checked_packages package manifests"

      - name: Validate pure Stats v5 contract
        run: node scripts/ci/test-stats-v5.mjs

      - name: Validate TrackProfile similarity
        run: node scripts/ci/test-track-similarity.mjs

      - name: Validate Recommendation scoring
        run: node scripts/ci/test-recommendation-score.mjs

      - name: Validate pure Backup scheduler contract
        run: node scripts/ci/test-backup-scheduler.mjs

      - name: Validate pure Backup coordinator contract
        run: node scripts/ci/test-backup-coordinator.mjs

      - name: Validate application contracts
        run: node scripts/ci/validate-contracts.mjs
