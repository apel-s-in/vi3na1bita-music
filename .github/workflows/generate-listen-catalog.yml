name: Generate listening track catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate exact media catalog
        run: node scripts/ci/generate-listen-catalog.mjs

      - name: Validate generated catalog
        run: |
          test -s data/listen-track-catalog.json
          test -s data/listen-track-catalog.env.json
          test -s data/listen-track-catalog.function-env.json
          node - <<'NODE'
          const fs = require('fs');
          const flat = JSON.parse(fs.readFileSync('data/listen-track-catalog.env.json', 'utf8'));
          const albums = JSON.parse(fs.readFileSync('data/listen-track-catalog.function-env.json', 'utf8'));
          const flatRows = Object.entries(flat);
          const albumRows = Object.entries(albums);
          if (!flatRows.length || flatRows.some(([uid, value]) => !uid || !Array.isArray(value) || value.length < 3 || typeof value[2] !== 'string' || value[2].length < 16)) process.exit(2);
          if (!albumRows.length || albumRows.some(([key, value]) => !key.startsWith('LISTEN_TRACK_CATALOG_ALBUM_') || !value || typeof value !== 'object' || Array.isArray(value) || JSON.stringify(value).length > 4096)) process.exit(2);
          const merged = Object.assign({}, ...albumRows.map(([, value]) => value));
          if (Object.keys(merged).length !== flatRows.length) process.exit(2);
          console.log('tracks:', flatRows.length);
          albumRows.forEach(([key, value]) => console.log(key, Object.keys(value).length, JSON.stringify(value).length));
          NODE

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: update listening track catalog"
          branch: ${{ github.ref_name }}
          file_pattern: "data/listen-track-catalog.json data/listen-track-catalog.env.json data/listen-track-catalog.function-env.json"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
