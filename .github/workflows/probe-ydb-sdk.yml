name: Probe ydb-sdk capabilities

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия ydb-sdk"
        required: true
        default: "5.9.0"
        type: string

permissions:
  contents: read

concurrency:
  group: probe-ydb-sdk-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROBE_ROOT: /tmp/ydb-probe
      YDB_SDK_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install exact SDK
        run: |
          set -euo pipefail
          rm -rf "$PROBE_ROOT"
          mkdir -p "$PROBE_ROOT"
          cd "$PROBE_ROOT"
          npm init -y >/dev/null
          npm install --save-exact "ydb-sdk@${YDB_SDK_VERSION}"
          npm list ydb-sdk | tee installed-version.txt

      - name: Inspect package and public runtime API
        run: |
          set -euo pipefail
          cd "$PROBE_ROOT"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const findPackageRoot = () => {
            const entrypoint = require.resolve('ydb-sdk');
            let directory = path.dirname(entrypoint);

            while (true) {
              const manifest = path.join(directory, 'package.json');
              if (fs.existsSync(manifest)) {
                try {
                  const value = JSON.parse(fs.readFileSync(manifest, 'utf8'));
                  if (value?.name === 'ydb-sdk') return { directory, entrypoint, manifest, value };
                } catch {}
              }

              const parent = path.dirname(directory);
              if (parent === directory) break;
              directory = parent;
            }

            throw new Error('ydb_sdk_package_root_not_found');
          };

          const packageInfo = findPackageRoot();
          const output = {
            name: packageInfo.value.name,
            version: packageInfo.value.version,
            entrypoint: packageInfo.entrypoint,
            packageRoot: packageInfo.directory,
            main: packageInfo.value.main || '',
            module: packageInfo.value.module || '',
            types: packageInfo.value.types || packageInfo.value.typings || '',
            exports: packageInfo.value.exports || null,
            engines: packageInfo.value.engines || null,
            dependencies: packageInfo.value.dependencies || {}
          };

          fs.writeFileSync('package-info.json', `${JSON.stringify(output, null, 2)}\n`);

          const sdk = require('ydb-sdk');
          const describe = value => {
            const methods = new Set();
            let current = value;

            while (current && current !== Object.prototype && current !== Function.prototype) {
              Object.getOwnPropertyNames(current)
                .filter(name => name !== 'constructor')
                .forEach(name => methods.add(name));
              current = Object.getPrototypeOf(current);
            }

            return [...methods].sort();
          };

          const runtime = {
            exports: Object.keys(sdk).sort(),
            values: {}
          };

          for (const [name, value] of Object.entries(sdk)) {
            runtime.values[name] = {
              type: typeof value,
              prototypeMethods: value && ['function', 'object'].includes(typeof value)
                ? describe(value.prototype || value)
                : []
            };
          }

          fs.writeFileSync('runtime-api.json', `${JSON.stringify(runtime, null, 2)}\n`);
          console.log(`Package root: ${packageInfo.directory}`);
          console.log(`Public exports: ${runtime.exports.length}`);
          NODE

      - name: Extract transaction declarations and implementations
        run: |
          set -euo pipefail
          cd "$PROBE_ROOT"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const findPackageRoot = () => {
            const entrypoint = require.resolve('ydb-sdk');
            let directory = path.dirname(entrypoint);

            while (true) {
              const manifest = path.join(directory, 'package.json');
              if (fs.existsSync(manifest)) {
                try {
                  const value = JSON.parse(fs.readFileSync(manifest, 'utf8'));
                  if (value?.name === 'ydb-sdk') return directory;
                } catch {}
              }

              const parent = path.dirname(directory);
              if (parent === directory) break;
              directory = parent;
            }

            throw new Error('ydb_sdk_package_root_not_found');
          };

          const packageRoot = findPackageRoot();
          const outputRoot = path.resolve('transaction-sources');
          const terms = [
            'beginTransaction',
            'commitTransaction',
            'rollbackTransaction',
            'executeQuery',
            'executeDataQuery',
            'withTransaction',
            'transactionControl',
            'txControl',
            'serializableReadWrite',
            'onlineReadOnly',
            'staleReadOnly',
            'ITransactionMeta',
            'IExistingTransaction',
            'INewTransaction',
            'TransactionSettings',
            'transactionId',
            'txId'
          ];
          const termPattern = new RegExp(terms.join('|'));
          const files = [];
          const stack = [packageRoot];
          let scannedFiles = 0;

          const copySource = (absolute, relative) => {
            const destination = path.join(outputRoot, relative);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(absolute, destination);
          };

          while (stack.length) {
            const directory = stack.pop();
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name.endsWith('.map')) continue;
              const absolute = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                stack.push(absolute);
                continue;
              }

              if (!/\.(?:js|cjs|mjs|d\.ts)$/.test(entry.name)) continue;
              scannedFiles++;

              const source = fs.readFileSync(absolute, 'utf8');
              if (!termPattern.test(source)) continue;

              const relative = path.relative(packageRoot, absolute).replace(/\\/g, '/');
              const lines = source.split(/\r?\n/);
              const hitLines = [];

              lines.forEach((line, index) => {
                if (termPattern.test(line)) hitLines.push(index);
              });

              const groups = [];
              hitLines.forEach(index => {
                const last = groups[groups.length - 1];
                if (!last || index - last[last.length - 1] > 12) groups.push([index]);
                else last.push(index);
              });

              const contexts = groups.map(group => {
                const from = Math.max(0, group[0] - 6);
                const to = Math.min(lines.length, group[group.length - 1] + 9);
                return {
                  fromLine: from + 1,
                  toLine: to,
                  matchedLines: group.map(index => index + 1),
                  source: lines.slice(from, to)
                };
              });

              const matchedTerms = terms.filter(term => source.includes(term));
              files.push({
                file: relative,
                kind: entry.name.endsWith('.d.ts') ? 'declaration' : 'implementation',
                bytes: Buffer.byteLength(source, 'utf8'),
                sha256: crypto.createHash('sha256').update(source).digest('hex'),
                matchedTerms,
                contexts
              });
              copySource(absolute, relative);
            }
          }

          files.sort((left, right) => left.file.localeCompare(right.file));

          const termFiles = Object.fromEntries(terms.map(term => [
            term,
            files.filter(file => file.matchedTerms.includes(term)).map(file => file.file)
          ]));

          const report = {
            packageRoot,
            scannedFiles,
            matchingFiles: files.length,
            capabilities: Object.fromEntries(terms.map(term => [term, termFiles[term].length > 0])),
            termFiles,
            files
          };

          fs.writeFileSync('transaction-contract.json', `${JSON.stringify(report, null, 2)}\n`);

          const text = [];
          text.push(`Package root: ${packageRoot}`);
          text.push(`Scanned source files: ${scannedFiles}`);
          text.push(`Transaction-related files: ${files.length}`);
          text.push('');

          for (const file of files) {
            text.push(`===== ${file.file} [${file.kind}] =====`);
            text.push(`terms: ${file.matchedTerms.join(', ')}`);
            text.push(`sha256: ${file.sha256}`);

            for (const context of file.contexts) {
              text.push(`--- lines ${context.fromLine}-${context.toLine} ---`);
              context.source.forEach((line, offset) => {
                text.push(`${String(context.fromLine + offset).padStart(5, ' ')} | ${line}`);
              });
            }

            text.push('');
          }

          fs.writeFileSync('transaction-signatures.txt', `${text.join('\n')}\n`);

          if (!scannedFiles) throw new Error('ydb_sdk_sources_not_found');
          if (!files.length) throw new Error('ydb_sdk_transaction_references_not_found');
          if (!report.capabilities.executeQuery && !report.capabilities.executeDataQuery) {
            throw new Error('ydb_sdk_execute_api_not_found');
          }

          console.log(`Scanned files: ${scannedFiles}`);
          console.log(`Transaction-related files: ${files.length}`);
          NODE

      - name: Build capability report
        run: |
          set -euo pipefail
          cd "$PROBE_ROOT"

          node <<'NODE'
          const fs = require('fs');

          const packageInfo = JSON.parse(fs.readFileSync('package-info.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('runtime-api.json', 'utf8'));
          const contract = JSON.parse(fs.readFileSync('transaction-contract.json', 'utf8'));
          const expectedVersion = String(process.env.YDB_SDK_VERSION || '').trim();

          if (packageInfo.version !== expectedVersion) {
            throw new Error(`ydb_sdk_version_mismatch:${packageInfo.version}:${expectedVersion}`);
          }

          const capabilityRows = Object.entries(contract.capabilities)
            .map(([name, available]) => `- ${name}: ${available ? 'yes' : 'no'}`)
            .join('\n');

          const report = [
            '# ydb-sdk capability probe',
            '',
            `- Package: ${packageInfo.name}`,
            `- Version: ${packageInfo.version}`,
            `- Entrypoint: ${packageInfo.entrypoint}`,
            `- Package root: ${packageInfo.packageRoot}`,
            `- Public exports: ${runtime.exports.length}`,
            `- Scanned files: ${contract.scannedFiles}`,
            `- Transaction-related files: ${contract.matchingFiles}`,
            '',
            '## Transaction symbols',
            '',
            capabilityRows,
            '',
            '## Important note',
            '',
            'This probe performs static/runtime inspection only.',
            'It does not connect to YDB and does not assume whether the transaction identifier is id, txId or an SDK object.',
            ''
          ].join('\n');

          fs.writeFileSync('ydb-sdk-capabilities.md', report);
          fs.writeFileSync(
            'ydb-sdk-capabilities.txt',
            [
              fs.readFileSync('installed-version.txt', 'utf8'),
              fs.readFileSync('package-info.json', 'utf8'),
              fs.readFileSync('runtime-api.json', 'utf8'),
              fs.readFileSync('transaction-signatures.txt', 'utf8')
            ].join('\n')
          );
          NODE

          test -s package-info.json
          test -s runtime-api.json
          test -s transaction-contract.json
          test -s transaction-signatures.txt
          test -s ydb-sdk-capabilities.md
          test -s ydb-sdk-capabilities.txt
          cat ydb-sdk-capabilities.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload capability artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ydb-sdk-capabilities-${{ inputs.version }}
          path: |
            /tmp/ydb-probe/installed-version.txt
            /tmp/ydb-probe/package-info.json
            /tmp/ydb-probe/runtime-api.json
            /tmp/ydb-probe/transaction-contract.json
            /tmp/ydb-probe/transaction-signatures.txt
            /tmp/ydb-probe/transaction-sources/
            /tmp/ydb-probe/ydb-sdk-capabilities.md
            /tmp/ydb-probe/ydb-sdk-capabilities.txt
          if-no-files-found: warn
          retention-days: 14
