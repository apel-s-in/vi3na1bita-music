name: Generate INTEL test profiles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-intel-test-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate explicit test profiles
        run: |
          node scripts/ci/generate-intel-test-profiles.mjs
          node scripts/ci/generate-track-profiles-index.mjs

      - name: Validate generated profiles
        run: |
          node scripts/ci/validate-intel-profiles.mjs
          test "$(find data/track-profiles/v-ssore -maxdepth 1 -type f -name 'VS-*.json' | wc -l)" -eq 10
          test "$(find data/track-profiles -maxdepth 1 -type f -name 'VS-*.json' | wc -l)" -eq 0

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Intel: generate test TrackProfiles for В Ссоре"
          branch: ${{ github.ref_name }}
          file_pattern: "data/track-profiles-index.json data/track-profiles/v-ssore/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
