name: Generate .meta context

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.meta/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate current contexts
        run: |
          set -euo pipefail

          rm -f \
            .meta/project-adaptive.txt \
            .meta/vi3-signaling.txt \
            .meta/vi3-webpush.txt \
            .meta/vi3na1bita-backup-proxy.txt \
            .meta/vi3-loyalty-reminder.txt

          node generate-context.js --mode=both

          test -s .meta/project-full.txt
          test -s .meta/project-music-games.txt
          test -s .meta/functions/vi3-signaling.txt
          test -s .meta/functions/vi3-webpush.txt
          test -s .meta/functions/vi3na1bita-backup-proxy.txt
          test -s .meta/functions/vi3-loyalty-reminder.txt

          test ! -e .meta/project-adaptive.txt
          test ! -e .meta/vi3-signaling.txt
          test ! -e .meta/vi3-webpush.txt
          test ! -e .meta/vi3na1bita-backup-proxy.txt
          test ! -e .meta/vi3-loyalty-reminder.txt

          if grep -q "ПРАВИЛА ДЛЯ НЕЙРОСЕТЕЙ" .meta/functions/*.txt; then
            echo "ai-rules leaked into Cloud Function context"
            exit 2
          fi

          cloud_function_leaks="$(
            grep -En \
              '^(// FILE: /cloud-functions/|\[/cloud-functions/)' \
              .meta/project-full.txt || true
          )"

          if [ -n "$cloud_function_leaks" ]; then
            echo "Cloud Function paths leaked into project-full.txt:"
            printf '%s\n' "$cloud_function_leaks"
            exit 2
          fi

          if grep -Eq '^// \.\.\. \(truncate\)$' .meta/project-full.txt; then
            echo "project-full.txt was truncated"
            exit 2
          fi

          for context in \
            .meta/functions/vi3-signaling.txt \
            .meta/functions/vi3-webpush.txt \
            .meta/functions/vi3na1bita-backup-proxy.txt \
            .meta/functions/vi3-loyalty-reminder.txt; do
            test "$(grep -c '^// FILE: /index\.js$' "$context")" -eq 1
            test "$(grep -c '^// FILE: /package\.json$' "$context")" -eq 1
          done

          if grep -RFn \
            '// FILE: /package.json' \
            cloud-functions/*/index.js; then
            echo "Generated context was pasted into Cloud Function index.js"
            exit 2
          fi

          find .meta -maxdepth 2 -type f -print | sort

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: generate .meta context"
          branch: ${{ github.ref_name }}
          file_pattern: ".meta/**"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
