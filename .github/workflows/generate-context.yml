name: Generate .meta context
on:
  push:
    branches: [main, master]
    paths-ignore: ['.meta/**']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Generate application and Cloud Function contexts
        run: |
          set -euo pipefail
          node generate-context.js --mode=both --max-lines=20000

          test -s .meta/project-full.txt
          test -s .meta/project-adaptive.txt
          test -s .meta/project-music-games.txt
          test -s .meta/vi3-signaling.txt
          test -s .meta/vi3na1bita-backup-proxy.txt
          test -s .meta/vi3-webpush.txt

          if grep -q "cloud-functions/" .meta/project-full.txt; then
            echo "cloud-functions leaked into project-full.txt"
            exit 2
          fi

          grep -q "FILE: /index.js" .meta/vi3-signaling.txt
          grep -q "FILE: /package.json" .meta/vi3-signaling.txt
          grep -q "FILE: /index.js" .meta/vi3na1bita-backup-proxy.txt
          grep -q "FILE: /package.json" .meta/vi3na1bita-backup-proxy.txt
          grep -q "FILE: /index.js" .meta/vi3-webpush.txt
          grep -q "FILE: /package.json" .meta/vi3-webpush.txt

          ls -la .meta
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: generate .meta context"
          branch: ${{ github.ref_name }}
          file_pattern: ".meta/**"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
