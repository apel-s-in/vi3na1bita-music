name: E2E smoke

on:
  push:
    branches: [main, master]
    paths-ignore: ['.meta/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Validate application syntax
        run: node --input-type=module --check < scripts/app.js
      - name: Install test dependencies
        run: npm install --no-save @playwright/test@1.48.2 http-server@14.1.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: npx http-server -p 4173 -c-1 . > /tmp/vi3-http.log 2>&1 & echo $! > server.pid
      - name: Wait for local server
        run: for i in {1..30}; do curl -fsS "$BASE_URL/index.html" >/dev/null && exit 0; sleep 1; done; cat /tmp/vi3-http.log; exit 1
      - name: Run Playwright tests
        run: npx playwright test scripts/e2e --reporter=line --workers=1 --retries=1
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            /tmp/vi3-http.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
