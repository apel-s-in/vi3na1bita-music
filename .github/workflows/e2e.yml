name: E2E smoke

on:
  push:
    branches: [main, master]
    paths-ignore: ['.meta/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Validate application syntax
        run: |
          node --check service-worker.js
          while IFS= read -r file; do
            echo "CHECK $file"
            node --input-type=module --check < "$file"
          done < <(
            find scripts src \
              -type f \
              -name '*.js' \
              ! -path 'scripts/vendor/*' \
              | sort
          )
      - name: Install test dependencies
        run: npm install --no-save @playwright/test@1.55.0 http-server@14.1.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: npx http-server -p 4173 -c-1 . > /tmp/vi3-http.log 2>&1 & echo $! > server.pid
      - name: Wait for local server
        run: for i in {1..30}; do curl -fsS "$BASE_URL/index.html" >/dev/null && exit 0; sleep 1; done; cat /tmp/vi3-http.log; exit 1
      - name: Run local blocking smoke
        id: local-smoke
        run: npx playwright test --config=scripts/e2e/playwright.config.js --grep-invert "@remote"

      - name: Run external Friends integration
        id: remote-integration
        continue-on-error: true
        run: npx playwright test --config=scripts/e2e/playwright.config.js --grep "@remote"

      - name: Collect Playwright diagnostics
        if: failure() || steps.remote-integration.outcome == 'failure'
        run: |
          mkdir -p test-results
          cp /tmp/vi3-http.log test-results/http-server.log 2>/dev/null || true

      - name: Upload Playwright diagnostics
        if: failure() || steps.remote-integration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
