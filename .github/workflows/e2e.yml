name: E2E smoke

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'service-worker.js'
      - 'albums.json'
      - 'scripts/**'
      - 'src/**'
      - 'styles/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'service-worker.js'
      - 'albums.json'
      - 'scripts/**'
      - 'src/**'
      - 'styles/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Validate application syntax
        run: |
          node --check service-worker.js
          while IFS= read -r file; do
            echo "CHECK $file"
            node --input-type=module --check < "$file"
          done < <(
            find scripts src \
              -type f \
              -name '*.js' \
              ! -path 'scripts/vendor/*' \
              | sort
          )
      - name: Install test dependencies
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/vi3-http.log 2>&1 & echo $! > server.pid
      - name: Wait for local server
        run: |
          for i in {1..30}; do
            if curl -fsS "$BASE_URL/index.html" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vi3-http.log
          exit 1
      - name: Run local blocking smoke
        id: local-smoke
        run: npx playwright test --config=scripts/e2e/playwright.config.js --grep-invert "@remote"

      - name: Run external Friends integration
        id: remote-integration
        continue-on-error: true
        run: npx playwright test --config=scripts/e2e/playwright.config.js --grep "@remote"

      - name: Collect Playwright diagnostics
        if: failure() || steps.remote-integration.outcome == 'failure'
        run: |
          mkdir -p test-results
          cp /tmp/vi3-http.log test-results/http-server.log 2>/dev/null || true

      - name: Upload Playwright diagnostics
        if: failure() || steps.remote-integration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local server
        if: always()
        run: |
          if [ -f server.pid ]; then
            pid="$(cat server.pid)"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
  webkit-informational:
    name: WebKit lifecycle (manual informational)
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 20
    env:
      BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0

      - name: Verify WebKit
        run: npx playwright install webkit

      - name: Start local server
        run: python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/vi3-webkit-http.log 2>&1 & echo $! > webkit-server.pid

      - name: Wait for local server
        run: |
          i=0
          while [ "$i" -lt 30 ]; do
            if curl -fsS "$BASE_URL/index.html" >/dev/null 2>&1; then
              exit 0
            fi
            i=$((i + 1))
            sleep 1
          done
          cat /tmp/vi3-webkit-http.log
          exit 1

      - name: Run WebKit lifecycle subset
        run: npx playwright test --config=scripts/e2e/playwright.config.js --browser=webkit --grep "@webkit"

      - name: Upload WebKit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local server
        if: always()
        run: |
          if [ -f webkit-server.pid ]; then
            pid="$(cat webkit-server.pid)"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
