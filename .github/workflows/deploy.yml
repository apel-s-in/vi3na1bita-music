name: Deploy App to Yandex Cloud S3

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.meta/**'
      - 'cloud-functions/**'
      - 'generate-context.js'
      - '.github/workflows/generate-context.yml'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Полностью синхронизировать публичные файлы'
        required: false
        default: false
        type: boolean
      configure_cors:
        description: 'Повторно записать CORS bucket'
        required: false
        default: false
        type: boolean

concurrency:
  group: yc-s3-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure CORS
        if: github.event_name == 'workflow_dispatch' && inputs.configure_cors
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'ru-central1'
        run: |
          cat > /tmp/cors.json << 'EOF'
          {"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":86400}]}
          EOF
          aws --endpoint-url=https://storage.yandexcloud.net s3api put-bucket-cors --bucket vi3na1bita --cors-configuration file:///tmp/cors.json

      - name: Incremental deploy public files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'ru-central1'
          BEFORE_SHA: ${{ github.event.before }}
          FULL_SYNC: ${{ inputs.full_sync || false }}
          BUCKET: vi3na1bita
        run: |
          set -euo pipefail
          upload_count=0
          delete_count=0

          is_public_file() {
            case "$1" in
              .git/*|.github/*|.meta/*|cloud-functions/*|scripts/ci/*|scripts/e2e/*|generate-context.js) return 1 ;;
              albums/gallery/*|audio/*|data/*|icons/*|img/*|news/*|scripts/*|src/*|styles/*) return 0 ;;
              albums/*) return 1 ;;
              index.html|oauth-callback.html|manifest.json|albums.json|service-worker.js) return 0 ;;
              *) return 1 ;;
            esac
          }

          upload_file() {
            local f="$1"
            [ -f "$f" ] || return 0
            is_public_file "$f" || return 0
            local cc="public,max-age=3600"
            if [[ "$f" == img/* ]] || [[ "$f" == audio/* ]] || [[ "$f" == icons/* ]]; then cc="public,max-age=31536000,immutable"; fi
            if [[ "$f" == *.html ]] || [[ "$f" == manifest.json ]] || [[ "$f" == service-worker.js ]]; then cc="no-cache"; fi
            upload_count=$((upload_count + 1))
            echo "PUT $f"
            aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$f" "s3://$BUCKET/$f" --cache-control "$cc" --only-show-errors
          }

          delete_file() {
            local f="$1"
            is_public_file "$f" || return 0
            delete_count=$((delete_count + 1))
            echo "DELETE $f"
            aws --endpoint-url=https://storage.yandexcloud.net s3 rm "s3://$BUCKET/$f" --only-show-errors || true
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FULL_SYNC" != "true" ]; then
            BEFORE_SHA="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
            echo "Manual incremental deploy: ${BEFORE_SHA:-missing} -> $GITHUB_SHA"
          fi

          if [ "$FULL_SYNC" = "true" ] || [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Explicit/initial deploy: full public sync"
            aws --endpoint-url=https://storage.yandexcloud.net s3 sync ./ "s3://$BUCKET/" --delete --only-show-errors \
              --exclude "*" \
              --include "index.html" \
              --include "oauth-callback.html" \
              --include "manifest.json" \
              --include "albums.json" \
              --include "service-worker.js" \
              --include "styles/*" \
              --include "scripts/*" \
              --include "scripts/**" \
              --include "src/*" \
              --include "src/**" \
              --include "data/*" \
              --include "data/**" \
              --include "icons/*" \
              --include "img/*" \
              --include "img/**" \
              --include "audio/*" \
              --include "news/*" \
              --include "albums/gallery/*" \
              --include "albums/gallery/**" \
              --exclude ".meta/*" \
              --exclude ".github/*" \
              --exclude "cloud-functions/*" \
              --exclude "cloud-functions/**" \
              --exclude "scripts/ci/*" \
              --exclude "scripts/e2e/*" \
              --exclude "generate-context.js" \
              --exclude "service-worker.js"

            echo "Publishing service-worker.js last"
            upload_file "service-worker.js"
            exit 0
          fi

          deploy_service_worker=0

          while IFS=$'\t' read -r status a b; do
            case "$status" in
              D*)
                delete_file "$a"
                ;;
              R*)
                delete_file "$a"
                if [ "$b" = "service-worker.js" ]; then
                  deploy_service_worker=1
                else
                  upload_file "$b"
                fi
                ;;
              C*)
                if [ "$b" = "service-worker.js" ]; then
                  deploy_service_worker=1
                else
                  upload_file "$b"
                fi
                ;;
              *)
                if [ "$a" = "service-worker.js" ]; then
                  deploy_service_worker=1
                else
                  upload_file "$a"
                fi
                ;;
            esac
          done < <(
            git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA"
          )

          if [ "$deploy_service_worker" = "1" ]; then
            echo "Publishing service-worker.js last"
            upload_file "service-worker.js"
          fi
          {
            echo "## Yandex Object Storage deploy"
            echo ""
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Uploaded: $upload_count"
            echo "- Deleted: $delete_count"
          } >> "$GITHUB_STEP_SUMMARY"
